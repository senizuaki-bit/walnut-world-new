name: Agent interface gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Ubuntu contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YAYA_TEST_POSTGRES_IMAGE: postgres@sha256:67dc02dae6e27fa8b4333df9bfdf15265b33ce04186cd7e65c0b8fe67ee37b97
      YAYA_TEST_GCC_IMAGE: gcc@sha256:b99b86a28812b1e6453a231a947dc43d76fe192788a12f344a9b568bf9f5d24c

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.7
          cache: pip
          cache-dependency-path: requirements-ci-win-py312.txt

      - name: Install locked Node dependencies
        shell: pwsh
        run: npm ci --ignore-scripts

      - name: Install pinned Python test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci-win-py312.txt

      - name: Pre-pull pinned Docker dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($image in @($env:YAYA_TEST_POSTGRES_IMAGE, $env:YAYA_TEST_GCC_IMAGE)) {
              docker pull $image
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to pull pinned Docker image $image."
              }
              docker image inspect $image | Out-Null
              if ($LASTEXITCODE -ne 0) {
                  throw "Pinned Docker image $image is unavailable after pull."
              }
          }

      - name: Download and verify Godot 4.5.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $archiveName = "Godot_v4.5.2-stable_linux.x86_64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $godotRoot = Join-Path $env:RUNNER_TEMP "godot-4.5.2"
          $downloadUrl = "https://github.com/godotengine/godot/releases/download/4.5.2-stable/$archiveName"

          # Official digest from the Godot 4.5.2 GitHub release asset metadata.
          $expectedSha256 = "87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          $actualSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
              throw "Godot archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256."
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $godotRoot -Force
          $godotExe = Join-Path $godotRoot "Godot_v4.5.2-stable_linux.x86_64"
          if (-not (Test-Path -LiteralPath $godotExe -PathType Leaf)) {
              throw "Godot executable is missing after verified archive extraction."
          }
          chmod +x -- $godotExe
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to mark the verified Godot executable as executable."
          }

          "YAYA_GODOT_EXE=$godotExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run unified interface gate
        shell: pwsh
        env:
          YAYA_LLM_ENDPOINT: ${{ secrets.YAYA_LLM_ENDPOINT }}
          YAYA_LLM_API_KEY: ${{ secrets.YAYA_LLM_API_KEY }}
          YAYA_LLM_MODEL: ${{ secrets.YAYA_LLM_MODEL }}
          YAYA_LLM_PROVIDER: ${{ secrets.YAYA_LLM_PROVIDER }}
          YAYA_LLM_THINKING_MODE: ${{ secrets.YAYA_LLM_THINKING_MODE }}
        run: |
          $ErrorActionPreference = "Stop"
          $requiredProviderSecrets = @(
              "YAYA_LLM_ENDPOINT",
              "YAYA_LLM_API_KEY",
              "YAYA_LLM_MODEL",
              "YAYA_LLM_PROVIDER",
              "YAYA_LLM_THINKING_MODE"
          )
          foreach ($name in $requiredProviderSecrets) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                  throw "Required GitHub Actions secret $name is not configured."
              }
          }
          $thinkingMode = $env:YAYA_LLM_THINKING_MODE.Trim().ToLowerInvariant()
          if ($thinkingMode -notin @("enabled", "disabled")) {
              throw "YAYA_LLM_THINKING_MODE must be exactly enabled or disabled."
          }
          pwsh -NoProfile -File scripts/verify-all.ps1

      - name: Verify immutable contract release tag
        if: startsWith(github.ref, 'refs/tags/agent-contracts-v')
        shell: pwsh
        run: node scripts/generate-contract-manifest.mjs --check --git-release $env:GITHUB_REF --verify-git-ref
