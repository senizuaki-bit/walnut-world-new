<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清泉村 · V2 原型对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4efdc;color:#213b2c;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{background:#183e2e;color:#fff4d5;padding:36px max(24px,5vw)}h1{margin:0 0 10px;font-size:32px}header p{margin:0;color:#c8d7bd}.toolbar{position:sticky;top:0;background:#f4efdcee;backdrop-filter:blur(8px);padding:16px max(24px,5vw);display:flex;gap:16px;align-items:center;z-index:2}select,button{font:inherit;padding:8px 16px;border:1px solid #c7b582;border-radius:8px;background:#fffbed;color:#213b2c;cursor:pointer}main{padding:0 max(24px,5vw) 36px}.comparison{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr));gap:20px}figure{margin:0}img{width:100%;display:block;border-radius:10px;cursor:zoom-in}figcaption{padding:10px 0;color:#65735b}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;margin-top:32px}.tile{padding:0;border:0;text-align:left;overflow:hidden;background:#fffbed}.tile span{display:block;padding:10px 14px}.tile img{border-radius:8px 8px 0 0}dialog{border:0;padding:0;max-width:96vw;background:transparent}dialog::backdrop{background:#081d15d9}dialog img{max-height:94vh;width:auto;max-width:96vw;object-fit:contain}.note{padding:14px 18px;border-left:3px solid #ca9434;background:#fffbed;margin-top:24px}a{color:inherit}
</style><header><h1>清泉村 · V2 原型对照</h1><p>使用本地 V2.2 原始组件与布局数据还原 · 21 个实机画面 · 79 项离线测试通过</p></header><div class="toolbar"><select id="scene" aria-label="选择页面"></select><button id="prev">← 上一页</button><button id="next">下一页 →</button></div><main><div class="comparison"><figure><img id="actual" alt="Godot 实机画面"><figcaption id="caption"></figcaption></figure><figure id="refwrap"><img id="reference" alt="素材包中的原始回拼原型"><figcaption>V2.2 原始回拼原型（素材包自带截图）</figcaption></figure></div><p class="note">画面来自本地教学流程的可重复截图。正式 Agent、Run、Receipt 与 Snapshot 的接口继续使用现有实现；这组截图不代表线上后端验收。六个核心页面提供原型并排对照，点击任意图片可放大。</p><div class="gallery" id="gallery"></div><p><a href="verification/art-v2-workshop-1600.png">查看 1600 × 900 工坊画面</a> · <a href="verification/art-v2-tests.json">离线回归记录</a></p></main><dialog id="zoom"><img alt="放大画面"></dialog><script>
const views=[{"id": "S01", "title": "首页", "image": "verification/art-v2-S01.png", "reference": "verification/reference-v2-S01.png"}, {"id": "S02", "title": "进入试验田", "image": "verification/art-v2-S02.png"}, {"id": "E01", "title": "观察旧工具", "image": "verification/art-v2-E01.png"}, {"id": "E02", "title": "手动比较", "image": "verification/art-v2-E02.png", "reference": "verification/reference-v2-E02.png"}, {"id": "E03", "title": "技能升级委托", "image": "verification/art-v2-E03.png", "reference": "verification/reference-v2-E03.png"}, {"id": "S03", "title": "叮当教学", "image": "verification/art-v2-S03.png"}, {"id": "S04", "title": "数据配对", "image": "verification/art-v2-S04.png", "reference": "verification/reference-v2-S04.png"}, {"id": "S05", "title": "分级动作", "image": "verification/art-v2-S05.png"}, {"id": "S06", "title": "理解汇总", "image": "verification/art-v2-S06.png"}, {"id": "S07", "title": "C++ 技能卷轴", "image": "verification/art-v2-S07.png", "reference": "verification/reference-v2-S07.png"}, {"id": "S08", "title": "分层教学提示", "image": "verification/art-v2-S08.png"}, {"id": "S09", "title": "世界验证", "image": "verification/art-v2-S09.png"}, {"id": "E08", "title": "运行失败反馈", "image": "verification/art-v2-E08.png"}, {"id": "E04", "title": "Bug 双作物反例", "image": "verification/art-v2-E04.png"}, {"id": "E05", "title": "AI 修改确认", "image": "verification/art-v2-E05.png", "reference": "verification/reference-v2-E05.png"}, {"id": "E09", "title": "目标完成", "image": "verification/art-v2-E09.png"}, {"id": "S10", "title": "验证反馈", "image": "verification/art-v2-S10.png"}, {"id": "E06", "title": "成长归档", "image": "verification/art-v2-E06.png"}, {"id": "E10", "title": "技能解锁", "image": "verification/art-v2-E10.png"}, {"id": "E07", "title": "自由复习", "image": "verification/art-v2-E07.png"}, {"id": "E11", "title": "下一关预告", "image": "verification/art-v2-E11.png"}];const select=document.querySelector('#scene');views.forEach((v,i)=>{select.add(new Option(v.id+' · '+v.title,i));const b=document.createElement('button');b.className='tile';b.innerHTML='<img loading="lazy" src="'+v.image+'" alt="'+v.title+'"><span>'+v.id+' · '+v.title+'</span>';b.onclick=()=>{select.value=i;show();window.scrollTo({top:0,behavior:'smooth'})};document.querySelector('#gallery').append(b)});function show(){const v=views[+select.value];document.querySelector('#actual').src=v.image;document.querySelector('#caption').textContent=v.id+' · '+v.title+' · Godot 实机';document.querySelector('#refwrap').hidden=!v.reference;if(v.reference)document.querySelector('#reference').src=v.reference;document.querySelector('#prev').disabled=+select.value===0;document.querySelector('#next').disabled=+select.value===views.length-1}select.onchange=show;document.querySelector('#prev').onclick=()=>{select.value=+select.value-1;show()};document.querySelector('#next').onclick=()=>{select.value=+select.value+1;show()};for(const el of document.querySelectorAll('.comparison img'))el.onclick=()=>{document.querySelector('#zoom img').src=el.src;document.querySelector('#zoom').showModal()};document.querySelector('#zoom').onclick=e=>e.currentTarget.close();show();
</script></html>
