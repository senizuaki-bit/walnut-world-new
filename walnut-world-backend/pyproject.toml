[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "walnut-world-backend"
version = "0.1.0"
description = "Contract-first transport for Walnut World."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "jsonschema>=4.23,<5",
    "SQLAlchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "uvicorn[standard]>=0.30,<1",
    "yaya_agent_contracts==0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/contract/test_contract_release.py" = ["I001"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src"]
extraPaths = ["src"]
